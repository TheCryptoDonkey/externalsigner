name: Dependency audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inherited-lnbits-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the stable LNbits runtime
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install --upgrade pip pip-audit
          .audit-venv/bin/python -m pip install \
            "lnbits @ git+https://github.com/lnbits/lnbits.git@v1.5.6"
      - name: Audit the complete inherited runtime
        run: .audit-venv/bin/python -m pip_audit --strict
