name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        lnbits-ref: ["v1.5.6", "dev"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Create test environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install \
            "lnbits @ git+https://github.com/lnbits/lnbits.git@${{ matrix.lnbits-ref }}" \
            black httpx mypy pytest pytest-asyncio ruff websockets
      - name: Python quality gate
        run: make check
      - name: Test suite
        run: make test
      - name: Frontend formatting
        run: make frontend

  postgres:
    strategy:
      fail-fast: false
      matrix:
        lnbits-ref: ["v1.5.6", "dev"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lnbits
          POSTGRES_USER: lnbits
          POSTGRES_PASSWORD: externalsigner-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lnbits -d lnbits"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LNBITS_DATABASE_URL: postgres://lnbits:externalsigner-test@127.0.0.1:5432/lnbits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Create test environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install \
            "lnbits @ git+https://github.com/lnbits/lnbits.git@${{ matrix.lnbits-ref }}" \
            httpx pytest pytest-asyncio websockets
      - name: PostgreSQL migration and test suite
        run: make test
