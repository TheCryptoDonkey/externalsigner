[project]
name = "lnbits-externalsigner"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
description = "Use an external NIP-46 signer from LNbits without importing an nsec."
authors = [{ name = "The Crypto Donkey" }]
license = { text = "MIT" }
urls = { Repository = "https://github.com/TheCryptoDonkey/externalsigner" }
dependencies = ["lnbits>=1.5.6,<2"]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["interop: exercises another NIP-46 implementation"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["A", "B", "C", "E", "F", "I", "N", "RUF", "UP", "W"]
ignore = ["C901", "RUF012", "UP007"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["validator"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
plugins = ["pydantic.mypy"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["lnbits.*", "loguru.*", "nostr_sdk.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
  "black>=24.3.0",
  "httpx>=0.27.0",
  "mypy>=1.11.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
  "websockets>=15.0.0",
]
